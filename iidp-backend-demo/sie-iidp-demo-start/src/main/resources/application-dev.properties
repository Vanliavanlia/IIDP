#spring.mvc.pathmatch.matching-strategy=ant_path_matcher
logging:
config: logback.xml
level:
com.sie.snest: info

#spring
server.port=8061
logger.show_sql=true
spring.http.multipart.max-file-size=200MB
spring.http.multipart.max-request-size=500MB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

#profile
engine.run.mode=single
#CLOUD: 元数据从云端应用市场获取；EDGE: 元数据从本地 apps/modules 的jar包解析
#本地无应用市场，使用 EDGE 才能注册模型与服务映射
engine.store.meta.mode=CLOUD

appAuth.Server=http://127.0.0.1:8080
appAuth.registerUrl=/api/v1/register
appAuth.unregisterUrl=/api/v1/unregister
appAuth.authUrl=/api/v1/auth
appAuth.engineVersion=v1.0.0

#NONE: \u8DF3\u8FC7\u6570\u636E\u5E93\u66F4\u65B0
#CREATE: \u66F4\u65B0\u6570\u636E\u5E93\u8868\u3002\u7F3A\u7701\u503C
#VALIDATE: \u4E0D\u66F4\u65B0\u6570\u636E\u5E93\uFF0C\u4F46\u662F\u4F1A\u5728\u63A7\u5236\u5408\u6253\u5370\u66F4\u65B0\u8BED\u53E5\uFF0C\u901A\u5E38\u7528\u4E8E\u9879\u76EE\u4E0A\u7EBF\u540E
#engine.model2ddl.mode=CREATE
# 本地 MinIO：runtime\minio\minio.exe，数据目录 runtime\minio\data，控制台 http://127.0.0.1:9001
# 原配置指向厂商内网 192.168.175.54:9000（不可达，会导致启动卡在创建默认存储桶）。
# seeder.sync 必须为 true，否则 AppLifecycleProcess.loadSeedData 会直接 return，
# 视图/菜单/用户等种子数据（rbac_user 等）全部不会导入。
seeder.sync=true

#minio
# 本地 MinIO（用户提供的 minio.exe），凭据须与启动 MinIO 时的 MINIO_ROOT_USER/PASSWORD 一致。
minio.endpoint=http://127.0.0.1:9000
minio.accessKey=snest
minio.secretKey=12345678
minio.bucketName=apps

#redis
redis.host=127.0.0.1
redis.port=6379
redis.db=5
redis.password=
redis.max_total=100
redis.max_idle=100
redis.min_idle=0
redis.max_wait_millis=1000
redis.connection_timeout=2000
redis.so_timeout=30000


